<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в TikTok...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #010101;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #fe2c55; /* Цвет TikTok */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #fe2c55;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>Открываем TikTok</h1>
        <p>Если приложение не открылось автоматически,<br>нажмите кнопку ниже:</p>
        
        <!-- Прямая ссылка на профиль -->
        <a href="snssdk1233://user/profile/mark_space1" id="openBtn" class="btn">ОТКРЫТЬ ПРИЛОЖЕНИЕ</a>
    </div>

    <script>
        const appUrl = "snssdk1233://user/profile/mark_space1";
        const webUrl = "https://www.tiktok.com/@mark_space1?_r=1&_t=ZS-95MMs28gans";
        const btn = document.getElementById('openBtn');

        // Функция открытия приложения
        function openApp() {
            const startTime = Date.now();
            
            // Пробуем открыть приложение
            window.location.href = appUrl;
            
            // Проверяем, не вернулся ли пользователь (приложение не открылось)
            setTimeout(function() {
                const elapsed = Date.now() - startTime;
                // Если пользователь всё ещё на странице и прошло больше 1.5 сек
                if (elapsed > 1500 && document.visibilityState === 'visible') {
                    // Приложение не установлено или не открылось - идём на веб-версию
                    window.location.href = webUrl;
                }
            }, 2000);
        }

        // Обработка клика по кнопке
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            openApp();
        });

        // Мягкая попытка автоматического открытия (без принудительного редиректа)
        // Браузеры часто блокируют это, поэтому основной способ - кнопка
        setTimeout(function() {
            // Только если пользователь ещё ничего не нажал
            if (document.visibilityState === 'visible') {
                window.location.href = appUrl;
            }
        }, 500);
    </script>
</body>
</html>
