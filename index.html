<script>
    function openTikTok() {
        const tiktokUser = "mark_space1";
        // Чистый никнейм без @ для схем
        const username = "mark_space1"; 
        // Полная веб-ссылка для отката
        const webUrl = "https://www.tiktok.com/@" + username + "?_r=1&_t=ZS-95MMs28gans";
        
        const ua = navigator.userAgent || navigator.vendor || window.opera;

        // 1. Попытка для Android
        if (/android/i.test(ua)) {
            const intentUrl = "intent://www.tiktok.com/@" + username + "#Intent;package=com.zhiliaoapp.musically;scheme=https;end";
            window.location.href = intentUrl;
        } 
        // 2. Попытка для iOS (iPhone/iPad)
        else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
            const iosUrl = "snssdk1233://user/profile/" + username;
            window.location.replace(iosUrl);
        } 
        // 3. Для ПК или других систем
        else {
            window.location.replace(webUrl);
        }

        // Запасной вариант: если через 2.5 сек мы все еще на этой странице, 
        // значит приложение не открылось — отправляем в браузер.
        setTimeout(function() {
            if (!document.hidden) {
                window.location.href = webUrl;
            }
        }, 2500);
    }

    // Запускаем при загрузке
    window.onload = openTikTok;
</script>
